<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Classroom Clock & Timer</title>

  <style>
    :root {
      --bg: #fffdf8;
      --text: #2f3437;
      --muted: #6b7280;
      --ring: #90b7a1;
      --track: #ececec;
      --lavender: #ece6f8;
      --green: #d8ecdf;
      --red: #f5d8d8;
      --warning: #f3d38d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 360px;
      margin: 0 auto;
    }

    .eyebrow {
      text-align: center;
      font-size: 11px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .clock {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin: 6px 0 18px;
      font-variant-numeric: tabular-nums;
    }

    .ring {
      width: 220px;
      height: 220px;
      margin: 8px auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(
        var(--ring) 360deg,
        var(--track) 0deg
      );
    }

    .inner {
      width: 178px;
      height: 178px;
      border-radius: 50%;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .time {
      font-size: 42px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      min-height: 15px;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px 0 12px;
    }

    button {
      min-height: 42px;
      border: none;
      border-radius: 10px;
      padding: 10px 8px;
      background: var(--lavender);
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .custom {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin: 10px 0 12px;
    }

    input {
      min-height: 42px;
      width: 100%;
      border: 1px solid #dddddd;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 16px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .start {
      background: var(--green);
    }

    .reset {
      background: var(--red);
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 14px;
      line-height: 1.4;
    }

    .timesup .ring {
      background: conic-gradient(
        var(--warning) 360deg,
        var(--warning) 0deg
      );
    }

    .timesup .time {
      color: #a33a2f;
    }

    @media (max-width: 320px) {
      body {
        padding: 12px;
      }

      .ring {
        width: 190px;
        height: 190px;
      }

      .inner {
        width: 152px;
        height: 152px;
      }

      .time {
        font-size: 36px;
      }

      .clock {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="wrap" id="app">

    <div class="eyebrow">
      Current Time
    </div>

    <div class="clock" id="clock">
      --:--
    </div>


    <div class="eyebrow">
      Visual Timer
    </div>

    <div class="ring" id="ring">

      <div class="inner">

        <div class="time" id="display">
          05:00
        </div>

        <div class="status" id="status">
          Ready
        </div>

      </div>

    </div>


    <div class="presets">

      <button type="button" data-min="1">
        1 min
      </button>

      <button type="button" data-min="5">
        5 min
      </button>

      <button type="button" data-min="10">
        10 min
      </button>

      <button type="button" data-min="15">
        15 min
      </button>

      <button type="button" data-min="20">
        20 min
      </button>

      <button type="button" data-min="30">
        30 min
      </button>

    </div>


    <div class="custom">

      <input
        id="custom"
        type="number"
        min="0.1"
        max="180"
        step="0.1"
        placeholder="Custom minutes"
      >

      <button type="button" id="set">
        Set
      </button>

    </div>


    <div class="controls">

      <button
        type="button"
        class="start"
        id="start"
      >
        Start
      </button>

      <button
        type="button"
        class="reset"
        id="reset"
      >
        Reset
      </button>

    </div>


    <div class="footer">
      Choose a preset, then Start.
      Reset returns to the selected length.
    </div>

  </main>


  <script>
    Office.onReady(() => {

      const app =
        document.getElementById("app");

      const clock =
        document.getElementById("clock");

      const display =
        document.getElementById("display");

      const status =
        document.getElementById("status");

      const ring =
        document.getElementById("ring");

      const startButton =
        document.getElementById("start");

      const resetButton =
        document.getElementById("reset");

      const customInput =
        document.getElementById("custom");

      const setButton =
        document.getElementById("set");


      let originalMilliseconds =
        5 * 60 * 1000;

      let remainingMilliseconds =
        originalMilliseconds;

      let endTime = null;

      let timerInterval = null;

      let running = false;


      function updateClock() {

        const now =
          new Date();

        const currentTime =
          now.toLocaleTimeString(
            [],
            {
              hour: "numeric",
              minute: "2-digit"
            }
          );

        clock.textContent =
          currentTime;
      }


      function formatTime(milliseconds) {

        const totalSeconds =
          Math.max(
            0,
            Math.ceil(
              milliseconds / 1000
            )
          );

        const minutes =
          Math.floor(
            totalSeconds / 60
          );

        const seconds =
          totalSeconds % 60;

        return (
          String(minutes)
            .padStart(2, "0")
          +
          ":"
          +
          String(seconds)
            .padStart(2, "0")
        );
      }


      function renderTimer() {

        display.textContent =
          formatTime(
            remainingMilliseconds
          );

        let fraction = 0;

        if (
          originalMilliseconds > 0
        ) {

          fraction =
            remainingMilliseconds
            /
            originalMilliseconds;
        }

        fraction =
          Math.max(
            0,
            Math.min(
              1,
              fraction
            )
          );

        const degrees =
          fraction * 360;

        ring.style.background =
          `conic-gradient(
            var(--ring) ${degrees}deg,
            var(--track) ${degrees}deg
          )`;
      }


      function pauseTimer(
        showPausedMessage = true
      ) {

        if (
          running
          &&
          endTime !== null
        ) {

          remainingMilliseconds =
            Math.max(
              0,
              endTime - Date.now()
            );
        }

        clearInterval(
          timerInterval
        );

        timerInterval =
          null;

        endTime =
          null;

        running =
          false;

        startButton.textContent =
          "Start";

        if (
          showPausedMessage
        ) {

          status.textContent =
            "Paused";
        }

        renderTimer();
      }


      function setTimerLength(
        minutes
      ) {

        const value =
          Number(minutes);

        if (
          !Number.isFinite(value)
          ||
          value <= 0
          ||
          value > 180
        ) {

          status.textContent =
            "Enter 0.1–180 minutes";

          return;
        }

        pauseTimer(false);

        originalMilliseconds =
          Math.round(
            value
            *
            60
            *
            1000
          );

        remainingMilliseconds =
          originalMilliseconds;

        app.classList.remove(
          "timesup"
        );

        status.textContent =
          "Ready";

        renderTimer();
      }


      function timerTick() {

        if (
          !running
          ||
          endTime === null
        ) {

          return;
        }

        remainingMilliseconds =
          Math.max(
            0,
            endTime - Date.now()
          );

        renderTimer();

        if (
          remainingMilliseconds <= 0
        ) {

          clearInterval(
            timerInterval
          );

          timerInterval =
            null;

          endTime =
            null;

          running =
            false;

          startButton.textContent =
            "Start";

          status.textContent =
            "Time's up!";

          app.classList.add(
            "timesup"
          );

          playAlertSound();
        }
      }


      function startTimer() {

        if (
          remainingMilliseconds <= 0
        ) {

          remainingMilliseconds =
            originalMilliseconds;
        }

        app.classList.remove(
          "timesup"
        );

        endTime =
          Date.now()
          +
          remainingMilliseconds;

        running =
          true;

        startButton.textContent =
          "Pause";

        status.textContent =
          "Running";

        timerInterval =
          setInterval(
            timerTick,
            200
          );

        timerTick();
      }


      function resetTimer() {

        pauseTimer(false);

        remainingMilliseconds =
          originalMilliseconds;

        app.classList.remove(
          "timesup"
        );

        status.textContent =
          "Ready";

        renderTimer();
      }


      function playAlertSound() {

        try {

          const AudioContextClass =
            window.AudioContext
            ||
            window.webkitAudioContext;

          if (
            !AudioContextClass
          ) {

            return;
          }

          const audioContext =
            new AudioContextClass();

          const oscillator =
            audioContext
              .createOscillator();

          const gain =
            audioContext
              .createGain();

          oscillator.connect(
            gain
          );

          gain.connect(
            audioContext.destination
          );

          oscillator.frequency.value =
            660;

          gain.gain.value =
            0.08;

          oscillator.start();

          setTimeout(
            () => {

              oscillator.stop();

              audioContext.close();

            },
            500
          );

        } catch (error) {

          console.log(
            "Audio unavailable."
          );
        }
      }


      document
        .querySelectorAll(
          "[data-min]"
        )
        .forEach(
          button => {

            button
              .addEventListener(
                "click",
                () => {

                  setTimerLength(
                    button.dataset.min
                  );
                }
              );
          }
        );


      setButton
        .addEventListener(
          "click",
          () => {

            setTimerLength(
              customInput.value
            );
          }
        );


      customInput
        .addEventListener(
          "keydown",
          event => {

            if (
              event.key
              ===
              "Enter"
            ) {

              setTimerLength(
                customInput.value
              );
            }
          }
        );


      startButton
        .addEventListener(
          "click",
          () => {

            if (
              running
            ) {

              pauseTimer();

            } else {

              startTimer();
            }
          }
        );


      resetButton
        .addEventListener(
          "click",
          resetTimer
        );


      updateClock();

      setInterval(
        updateClock,
        1000
      );

      renderTimer();

    });
  </script>

</body>
</html>
