<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Classroom Clock & Timer</title>
<style>
:root{--bg:#fffdf8;--text:#2f3437;--muted:#6b7280;--ring:#90b7a1;--track:#ececec;--lav:#ece6f8;--green:#d8ecdf;--red:#f5d8d8;--warn:#f3d38d}*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:360px;margin:auto}.eyebrow{text-align:center;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}.clock{text-align:center;font-size:34px;font-weight:800;margin:6px 0 18px;font-variant-numeric:tabular-nums}.ring{width:220px;height:220px;margin:8px auto 16px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ring) 360deg,var(--track) 0)}.inner{width:178px;height:178px;border-radius:50%;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center}.time{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}.status{font-size:12px;color:var(--muted);margin-top:8px;min-height:15px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}button{min-height:42px;border:0;border-radius:10px;padding:10px 8px;background:var(--lav);color:var(--text);font-weight:700;font-size:14px;cursor:pointer}.custom{display:grid;grid-template-columns:1fr auto;gap:8px;margin:10px 0 12px}input{min-height:42px;width:100%;border:1px solid #ddd;border-radius:10px;padding:8px 10px;font-size:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.start{background:var(--green)}.reset{background:var(--red)}.footer{text-align:center;font-size:11px;color:var(--muted);margin-top:14px;line-height:1.4}.timesup .ring{background:conic-gradient(var(--warn) 360deg,var(--warn) 0)}.timesup .time{color:#a33a2f}@media(max-width:320px){body{padding:12px}.ring{width:190px;height:190px}.inner{width:152px;height:152px}.time{font-size:36px}}
</style>
</head>
<body>
<main class="wrap" id="app">
<div class="eyebrow">Current time</div><div class="clock" id="clock">--:--</div>
<div class="eyebrow">Visual timer</div><div class="ring" id="ring"><div class="inner"><div class="time" id="display">05:00</div><div class="status" id="status">Ready</div></div></div>
<div class="presets"><button data-min="1">1 min</button><button data-min="5">5 min</button><button data-min="10">10 min</button><button data-min="15">15 min</button><button data-min="20">20 min</button><button data-min="30">30 min</button></div>
<div class="custom"><input id="custom" type="number" min="0.1" max="180" step="0.1" placeholder="Custom minutes"><button id="set">Set</button></div>
<div class="controls"><button class="start" id="start">Start</button><button class="reset" id="reset">Reset</button></div>
<div class="footer">Choose a preset, then Start. Reset returns to the selected length.</div>
</main>
<script>
(()=>{const app=document.getElementById('app'),clock=document.getElementById('clock'),display=document.getElementById('display'),status=document.getElementById('status'),ring=document.getElementById('ring'),startBtn=document.getElementById('start'),resetBtn=document.getElementById('reset'),custom=document.getElementById('custom'),setBtn=document.getElementById('set');let original=300000,remaining=original,endAt=null,id=null,running=false;function updateClock(){clock.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function render(){display.textContent=fmt(remaining);const d=(original?Math.max(0,Math.min(1,remaining/original)):0)*360;ring.style.background=`conic-gradient(var(--ring) ${d}deg,var(--track) ${d}deg)`}function pause(label=true){if(running&&endAt)remaining=Math.max(0,endAt-Date.now());clearInterval(id);id=null;endAt=null;running=false;startBtn.textContent='Start';if(label)status.textContent='Paused';render()}function setLength(m){m=Number(m);if(!Number.isFinite(m)||m<=0||m>180){status.textContent='Enter 0.1–180 minutes';return}pause(false);original=Math.round(m*60000);remaining=original;app.classList.remove('timesup');status.textContent='Ready';render()}function tick(){if(!running)return;remaining=Math.max(0,endAt-Date.now());render();if(remaining<=0){clearInterval(id);id=null;running=false;endAt=null;startBtn.textContent='Start';status.textContent="Time's up!";app.classList.add('timesup');try{const A=window.AudioContext||window.webkitAudioContext;if(A){const c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();c.close()},450)}}catch(e){}}}function start(){if(remaining<=0)remaining=original;app.classList.remove('timesup');endAt=Date.now()+remaining;running=true;startBtn.textContent='Pause';status.textContent='Running';id=setInterval(tick,200);tick()}function reset(){pause(false);remaining=original;app.classList.remove('timesup');status.textContent='Ready';render()}document.querySelectorAll('[data-min]').forEach(b=>b.addEventListener('click',()=>setLength(b.dataset.min)));setBtn.addEventListener('click',()=>setLength(custom.value));custom.addEventListener('keydown',e=>{if(e.key==='Enter')setLength(custom.value)});startBtn.addEventListener('click',()=>running?pause():start());resetBtn.addEventListener('click',reset);updateClock();setInterval(updateClock,1000);render()})();
</script>
</body></html>
